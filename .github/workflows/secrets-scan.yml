name: Secrets Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # 每日 UTC 02:00 跑历史回扫（北京时间 10:00）
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan-pr:
    name: Scan PR / push changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scan all files in workspace
        run: node scripts/check-secrets.mjs --all-files --ci
        # 退出码 1 = 命中，2 = 错误。CI 应当 fail-fast。

      - name: Upload scan report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: secrets-scan-report
          path: |
            secrets-scan-output.json
          if-no-files-found: ignore

  scan-history:
    name: Scan git history (daily)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scan recent commits (3 months rolling)
        run: |
          node scripts/check-secrets-history.mjs --months 3 --max-commits 5000 --json > secrets-history-output.json || EXIT_CODE=$?
          if [ -n "$EXIT_CODE" ] && [ "$EXIT_CODE" -ne 0 ]; then
            echo "⚠️ Secrets history scan detected $EXIT_CODE exit code (likely found secrets)"
            cat secrets-history-output.json | head -50
            exit $EXIT_CODE
          fi

      - name: Upload history scan report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secrets-history-report
          path: secrets-history-output.json
          if-no-files-found: ignore
