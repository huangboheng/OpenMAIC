# Philochora + OpenMAIC 生产环境 Nginx 反向代理配置
# 部署位置: /etc/nginx/sites-available/philochora.conf
# 启用: ln -s /etc/nginx/sites-available/philochora.conf /etc/nginx/sites-enabled/
#
# ── API 面契约（本文件是 VPS 边缘配置的唯一事实源）────────────────
# 本仓 app/api/** 的每一个路由都必须在本文件的黑名单或白名单中显式
# 落位，由 scripts/check-api-surface.mjs 在 pre-push 强制（逃生口
# SKIP_API_SURFACE_CHECK=1）。部署时使用 scripts/deploy-nginx.sh
# （--dry-run 预览 diff；apply 自动备份 + nginx -t + reload + 穿透验证）。
# 决策记录: docs/adr/0001-nginx-api-allowlist-contract.md
#
# ⚠ 双仓镜像（2026-08-26 回滚事故后强制规定）：Philochora 仓存在同名文件
#   deploy/nginx/philochora.conf，其部署脚本会拷贝该文件覆盖 VPS 配置。
#   两仓文件必须逐字节一致，任何一侧修改都必须同步另一侧，否则部署竞争
#   会把修复回滚。同步源永远以本仓为准（本仓有 check-api-surface 强制对账）。
#
# [FIX 2026-08-26] server-providers 从黑名单移入白名单。
# 根因：托管部署隐藏设置面板（NEXT_PUBLIC_SETTINGS_ENABLED 默认 OFF），
# 客户端模型配置完全依赖 GET /openmaic/api/server-providers 自动下发；
# 该路径被黑名单拦截（403），且客户端 fetchServerProviders 静默吞掉失败，
# 导致课堂讨论环节恒报"请选择一个模型"。该路由只返回模型列表与
# 配置存在性标志（无 key、无 baseUrl），放行不破坏托管安全意图。
# 保持拒绝（托管模式设置面板不可达，放行将向普通用户暴露服务商配置面）：
#   usage / provider/* / verify-* / comfyui-workflows / azure-voices

# [PERF] Rate limiting zone — must be in http{} block (or /etc/nginx/conf.d/rate-limit.conf)
# If this file is included in http{}, uncomment:
# limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# HTTP → HTTPS 强制跳转
server {
    listen 80;
    listen [::]:80;
    server_name philochora.com www.philochora.com;
    return 301 https://philochora.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name philochora.com;

    # --- TLS 证书 (Let's Encrypt) ---
    ssl_certificate     /etc/letsencrypt/live/philochora.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/philochora.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # --- 安全头 ---
    add_header X-Content-Type-Options nosniff always;
    # [FIX] 保持 SAMEORIGIN（与 api/lib/security-headers.ts 中的 Hono 头一致）
    # 原理：Nginx 仅在上游未设置同名响应头时才注入；Hono 现在也输出 SAMEORIGIN，
    # 此处 nginx 头为兜底，确保上游偶发缺失时也不会降到 DENY。
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # OpenMAIC 文档上传/视频导出需要大 body
    client_max_body_size 200m;

    # --- 日志 ---
    access_log /var/log/nginx/philochora-access.log;
    error_log  /var/log/nginx/philochora-error.log;

    # ═══════════════════════════════════════════════════════════
    # OpenMAIC 代理（白名单模式）
    # ═══════════════════════════════════════════════════════════

    # 页面级屏蔽（非 API 路由）：拦截 OpenMAIC 设置/管理页面路径。
    # app/api/** 下无对应路由，由 check-api-surface.mjs 视为防御性规则保留。
    location ~* ^/openmaic/(settings|config|setup|admin|providers|models)(/|$) {
        return 403;
    }
    # 设置面板专属端点保持拒绝（见文件头契约注释）。
    # server-providers 已于 2026-08-26 移出本黑名单（它是运行时模型下发
    # 通道而非配置管理面，详见文件头 [FIX] 说明）。
    # 注：verify- 为前缀匹配，覆盖 verify-model/verify-image-provider/
    # verify-pdf-provider/verify-video-provider 全部端点（由契约校验强制对齐）。
    location ~* ^/openmaic/api/(usage|provider|verify-.*|comfyui-workflows|azure-voices)(/|$) {
        return 403;
    }

    # 白名单：允许的 OpenMAIC 路径（课堂播放、聊天、生成、健康检查等）
    # BR-092: 加入 persistence/auth/callback/public —— 与 proxy.ts AUTH_WHITELIST 对齐；
    # 此前缺失导致课堂页 DocumentStore 403、头像/logo 403、OAuth 回调 403。
    # [FIX 2026-08-26]: 加入 server-providers —— 托管部署的模型配置下发通道，
    # 缺失导致课堂讨论环节报"请选择一个模型"（ADR-0001）。
    # [FIX 2026-08-26 #2]: 加入 favicon.ico|apple-icon.png|logos/ —— 与 proxy.ts
    # SEC-02 PAGE_ENTRY_PATTERN 对齐；此前缺失导致浏览器加载页面静态资源全部 403，
    # 课堂页"一直 loading"（HTML 能到、资产拿不到）。
    # 注意：使用 ^~ 优先级高于普通 location，确保在白名单匹配时不被下面的 /openmaic/ 兜底拦截
    location ~* ^/openmaic/(api/(chat|classroom|classroom-media|generate-classroom|generate/(scene-content|scene-actions|scene-outlines-stream|agent-profiles|image|video|tts|voice)|quiz-grade|health|proxy-media|pbl|access-code|export-video|philochora|agent|extract-document|parse-pdf|transcription|web-search|persistence|auth/callback|public|server-providers)|classroom/|_next/|favicon\.ico$|apple-icon\.png$|logos/) {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # SSE / 长时间生成任务需要长超时
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;  # SSE 流式响应不缓冲
    }

    # 其余 /openmaic/ 路径一律 403（兑底）
    # 根路径 /openmaic 与 /openmaic/ 直接 404 —— OpenMAIC 无公开首页，
    # 唯一合法入口是课堂页 /openmaic/classroom/{id}（来自 Philochora 课程页），
    # 白名单之外的任何路径均不允许渲染 OpenMAIC 页面内容。
    location = /openmaic {
        return 404;
    }
    location = /openmaic/ {
        return 404;
    }
    location /openmaic/ {
        return 403;
    }

    # ═══════════════════════════════════════════════════════════
    # Philochora 主站（Hono + React SPA）
    # ═══════════════════════════════════════════════════════════

    # [PERF] Static assets — Vite outputs hashed filenames, safe for immutable caching
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # [PERF] API rate limiting (requires limit_req_zone in http{} block)
    # Uncomment after adding limit_req_zone to nginx.conf:
    # location /api/ {
    #     limit_req zone=api_limit burst=50 nodelay;
    #     proxy_pass http://127.0.0.1:3000;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection "upgrade";
    #     proxy_read_timeout 120s;
    #     proxy_buffering off;
    # }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # SSE 路由（AI 对话流式响应）
        proxy_read_timeout 120s;
        proxy_buffering off;
        # BR-118：SPA 入口 HTML 不缓存，避免用户浏览器长期持有旧 bundle
        # （assets/ 已按文件名 hash 做 365d immutable，不受影响）
        add_header Cache-Control "no-cache" always;
    }
}
